services:
  postgres:
    image: postgres:latest
    container_name: gsnfin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  api:
    build:
      context: ./apps/api
    container_name: gsnfin_api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3001"
    networks:
      - backend
      - frontend

  web:
    build:
      context: ./apps/web
    container_name: gsnfin_web
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - api
    expose:
      - "3000"
    networks:
      - frontend

volumes:
  postgres_data:

networks:
  backend:
    internal: true
  frontend:
